    <link rel="canonical" href="https://bigogym.io/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Big O Gym",
        "url": "https://bigogym.io/",
        "description": "Big O practice for technical interviews. Read Python or JavaScript code, type the time and space complexity, get instant feedback.",
        "applicationCategory": "EducationalApplication",
        "applicationSubCategory": "InterviewPrep",
        "operatingSystem": "Any (web)",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "keywords": "big o, time complexity, space complexity, algorithm analysis, coding interview prep, leetcode, python, javascript",
        "featureList": [
          "60+ time and space complexity problems",
          "Python and JavaScript code snippets",
          "Free-form complexity input with a forgiving normalizer",
          "Daily problem mode",
          "Timed race sets",
          "Progress saved in localStorage"
        ],
        "audience": {
          "@type": "Audience",
          "audienceType": "Software engineers preparing for technical interviews"
        }
      }
    </script>

  </head>
  <body class="bg-bg text-text">
    <script>
      // Apply persisted theme before React mounts to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('complexity-practice:v1:theme');
          document.documentElement.dataset.theme =
            t === 'light' ? 'light' : 'dark';
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
